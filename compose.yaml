services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports: ["127.0.0.1:8000:8000"]
    environment:
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/vitalis.db}
      DATA_DIR: /app/data
      DEMO_MODE: "false"
      API_TOKEN: ${API_TOKEN:?Set API_TOKEN to a random value of at least 32 characters}
      SIMULATOR_AUTOSTART: "true"
    volumes: ["vitalis-data:/app/data"]
    restart: unless-stopped
volumes:
  vitalis-data:
