      <stop offset="0" stop-color="#20E3C2"/>
      <stop offset="0.55" stop-color="#169BFF"/>
      <stop offset="1" stop-color="#173CFF"/>
    </linearGradient>
    <linearGradient id="vitalis-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="0.5" stop-color="#E7F9FF"/>
      <stop offset="1" stop-color="#FFFFFF"/>
